<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Varo y Valgo de Rodilla en Vivo</title>
<style>
:root {
  --bg: #0F172A;
  --card: #1E293B;
  --card-border: #334155;
  --fg: #F8FAFC;
  --mut: #94A3B8;
  --line: #334155;
  --r: #38BDF8;   /* Rodilla Derecha */
  --l: #A855F7;   /* Rodilla Izquierda */
  --vg: #EC4899;  /* Valgo */
  --vr: #3B82F6;  /* Varo */
  --ok: #10B981;  /* Neutro/Correcto */
  --warn: #F59E0B;
}

@media(prefers-color-scheme: light) {
  :root {
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --card-border: #E2E8F0;
    --fg: #0F172A;
    --mut: #64748B;
    --line: #E2E8F0;
    --r: #0284C7;
    --l: #7C3AED;
    --vg: #DB2777;
    --vr: #2563EB;
    --ok: #059669;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  font-variant-numeric: tabular-nums;
}

main { max-width: 1500px; margin: 0 auto; padding: 16px 0; }
header { margin-bottom: 16px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.02em; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--mut); }
.mut { color: var(--mut); font-size: 13px; }

/* Contenedores y Tarjetas */
.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.controls-grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Botones y Controles */
button, label.bt {
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  background: var(--fg);
  color: var(--bg);
  border: 0;
  border-radius: 8px;
  padding: 10px 16px;
  min-height: 42px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.2s, transform 0.1s;
}
button:hover, label.bt:hover { opacity: 0.9; }
button:active { transform: scale(0.98); }
button.s { background: transparent; color: var(--fg); border: 1px solid var(--card-border); }
button:disabled { opacity: 0.35; cursor: not-allowed; }

select, input[type=range] { font: inherit; }
select {
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--card-border);
  background: var(--bg);
  color: var(--fg);
}

/* Escenario de Video Nítido */
.stage {
  position: relative;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 12px;
  aspect-ratio: 4/3;
  max-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
video, #ov {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: -webkit-optimize-contrast;
}
#ov { position: absolute; inset: 0; pointer-events: none; }

/* Grillas de datos */
.wrap { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media(min-width: 1024px) {
  .wrap { grid-template-columns: 1.4fr 1fr; align-items: start; }
}
.col { display: flex; flex-direction: column; gap: 16px; }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.metric-box {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  padding: 12px;
}
.big { font-size: 28px; font-weight: 800; line-height: 1.1; margin: 4px 0; }

/* Barras e indicadores */
.bar {
